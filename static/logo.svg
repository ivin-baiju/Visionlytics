<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="vlLogoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="vlIrisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </radialGradient>
    <style>
      @keyframes vlRadarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes vlPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes vlScanSweep {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      .vl-ring-spin {
        transform-origin: 24px 24px;
        animation: vlRadarSpin 8s linear infinite;
      }
      .vl-pupil-pulse {
        transform-origin: 24px 24px;
        animation: vlPulse 2.4s ease-in-out infinite;
      }
      .vl-scan-wave {
        transform-origin: 24px 24px;
        animation: vlScanSweep 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Modern squircle tile -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#vlLogoBg)" />

  <!-- Outer radar ring with dash markers (rotating) -->
  <g class="vl-ring-spin">
    <circle cx="24" cy="24" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="6 3 2 3" opacity="0.85" />
    <circle cx="24" cy="8" r="1.5" fill="#38BDF8" />
    <circle cx="40" cy="24" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Pulsing scanning wave ring -->
  <circle class="vl-scan-wave" cx="24" cy="24" r="11.5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Main optical aperture lens -->
  <circle cx="24" cy="24" r="9" fill="url(#vlIrisGlow)" stroke="#FFFFFF" stroke-width="2.2" />

  <!-- Center pupil with pulse -->
  <g class="vl-pupil-pulse">
    <circle cx="24" cy="24" r="4.2" fill="#FFFFFF" />
    <circle cx="24" cy="24" r="2.2" fill="#0284C7" />
  </g>

  <!-- Precision reticle ticks -->
  <line x1="24" y1="3" x2="24" y2="7" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="24" y1="41" x2="24" y2="45" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="3" y1="24" x2="7" y2="24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <line x1="41" y1="24" x2="45" y2="24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
</svg>
