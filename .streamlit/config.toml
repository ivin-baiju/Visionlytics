[theme]
base = "light"
primaryColor = "#8FBF2E"
backgroundColor = "#F5F6F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14161A"
borderColor = "#E9EAEC"
baseRadius = "medium"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
codeFont = "monospace"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["28px", "22px", "18px", "15px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

greenColor = "#0F9D58"
redColor = "#D93025"
orangeColor = "#B7791F"
blueColor = "#5B6472"
violetColor = "#9AA3AF"
grayColor = "#5B6472"

chartCategoricalColors = ["#8FBF2E", "#14161A", "#5B6472", "#B4E04C", "#9AA3AF", "#0F9D58", "#B7791F"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F7"
textColor = "#14161A"
borderColor = "#E9EAEC"
primaryColor = "#8FBF2E"

[server]
headless = true
maxUploadSize = 200
enableCORS = false
enableXsrfProtection = false
address = "localhost"

[browser]
gatherUsageStats = false
