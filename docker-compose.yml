services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visionlytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionlytics_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-visionlytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-visionlytics} -d $${POSTGRES_DB:-visionlytics}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:latest
    command: "server -s3 -s3.port=9000 -dir=/data"
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build:
      context: ./apps/ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-visionlytics}:${POSTGRES_PASSWORD:-visionlytics_dev_pw}@postgres:5432/${POSTGRES_DB:-visionlytics}
      REDIS_URL: redis://redis:6379
      ML_URL: http://ml:8000
      S3_ENDPOINT: http://s3:9000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      ml:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_PROXY: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
