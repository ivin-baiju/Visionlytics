<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" role="img" aria-label="Visionlytics — Precision Optical Telemetry and Computer Vision Platform">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E2328" stroke-width="1"/>
    </pattern>
    <pattern id="majorGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#grid)"/>
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#2A3138" stroke-width="1.25"/>
    </pattern>
    <radialGradient id="phosphorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB21F" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#FFB21F" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFB21F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB21F" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB21F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFB21F" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
      .sans { font-family: 'Cabinet Grotesk', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .pulse-ring {
        animation: pulseRing 3.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 180px 160px;
      }
      .rotate-slow {
        animation: spinSlow 24s linear infinite;
        transform-origin: 180px 160px;
      }
      .rotate-rev {
        animation: spinRev 16s linear infinite;
        transform-origin: 180px 160px;
      }
      .scan-bar {
        animation: scanMove 4.5s ease-in-out infinite;
      }
      .blink {
        animation: blinkDot 1.6s steps(2, start) infinite;
      }
      @keyframes pulseRing {
        0%, 100% { transform: scale(0.96); opacity: 0.75; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes scanMove {
        0%, 100% { transform: translateY(-130px); }
        50% { transform: translateY(130px); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
    </style>
  </defs>

  <!-- Chassis Background -->
  <rect width="1200" height="320" fill="#0B0C0D"/>
  <rect width="1200" height="320" fill="url(#majorGrid)"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#2A3138" stroke-width="2"/>

  <!-- Corner Crop Marks -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#FFB21F" stroke-width="2"/>
  <path d="M 1168 16 L 1184 16 L 1184 32" fill="none" stroke="#FFB21F" stroke-width="2"/>
  <path d="M 16 288 L 16 304 L 32 304" fill="none" stroke="#FFB21F" stroke-width="2"/>
  <path d="M 1168 304 L 1184 304 L 1184 288" fill="none" stroke="#FFB21F" stroke-width="2"/>

  <!-- Animated Scan Bar -->
  <g class="scan-bar">
    <rect x="20" y="140" width="1160" height="40" fill="url(#scanSweep)"/>
    <line x1="20" y1="160" x2="1180" y2="160" stroke="#FFB21F" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Left Optical Reticle Emblem -->
  <circle cx="180" cy="160" r="125" fill="url(#phosphorGlow)"/>

  <!-- Outer Graduated Dial -->
  <g class="rotate-slow">
    <circle cx="180" cy="160" r="96" fill="none" stroke="#2D353C" stroke-width="1.5"/>
    <circle cx="180" cy="160" r="96" fill="none" stroke="#FFB21F" stroke-width="2" stroke-dasharray="18 42"/>
  </g>

  <!-- Counter-Rotating Aperture Ring -->
  <g class="rotate-rev">
    <circle cx="180" cy="160" r="72" fill="none" stroke="#5FD39A" stroke-width="1.5" stroke-dasharray="8 16" stroke-opacity="0.75"/>
  </g>

  <!-- Pulsing Target Lock Box -->
  <g class="pulse-ring">
    <rect x="132" y="112" width="96" height="96" fill="none" stroke="#FFB21F" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Reticle Corner Brackets -->
    <path d="M 132 128 L 132 112 L 148 112" fill="none" stroke="#FFB21F" stroke-width="2.5"/>
    <path d="M 212 112 L 228 112 L 228 128" fill="none" stroke="#FFB21F" stroke-width="2.5"/>
    <path d="M 132 192 L 132 208 L 148 208" fill="none" stroke="#FFB21F" stroke-width="2.5"/>
    <path d="M 212 208 L 228 208 L 228 192" fill="none" stroke="#FFB21F" stroke-width="2.5"/>
  </g>

  <!-- Central Crosshair & Focal Core -->
  <line x1="180" y1="52" x2="180" y2="268" stroke="#FFB21F" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="72" y1="160" x2="288" y2="160" stroke="#FFB21F" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="180" cy="160" r="22" fill="#131619" stroke="#FFB21F" stroke-width="2"/>
  <circle cx="180" cy="160" r="6" fill="#FFB21F" class="blink"/>

  <!-- Emblem Readout Tag -->
  <rect x="116" y="88" width="128" height="18" rx="2" fill="#131619" stroke="#FFB21F" stroke-width="1"/>
  <text x="180" y="100" text-anchor="middle" fill="#FFB21F" font-size="10" font-weight="600" class="mono">LOCK #01 · 91.4%</text>

  <!-- Main Brand Typography & Telemetry Readouts -->
  <g transform="translate(340, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="50" width="465" height="26" rx="2" fill="#131619" stroke="#FFB21F" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="14" cy="63" r="4" fill="#5FD39A" class="blink"/>
    <text x="28" y="67" fill="#FFB21F" font-size="11.5" font-weight="600" letter-spacing="0.8" class="mono">PRECISION OPTICAL TELEMETRY · APACHE-2.0 ONNX · CIELAB ΔE00</text>

    <!-- Title -->
    <text x="0" y="142" fill="#F2F4F3" font-size="68" font-weight="800" letter-spacing="-1.8" class="sans">VISIONLYTICS</text>
    <text x="488" y="142" fill="#FFB21F" font-size="20" font-weight="600" class="mono">v1.0.0</text>

    <!-- Subtitle -->
    <text x="0" y="178" fill="#9AA3AB" font-size="17.5" font-weight="400" class="sans">
      Real-Time Multi-Object Tracking, Foreground CIEDE2000 Garment Colour Naming &amp; Training Studio
    </text>

    <!-- Divider Hairline -->
    <line x1="0" y1="202" x2="810" y2="202" stroke="#242A30" stroke-width="1"/>

    <!-- 4 Measured Golden Telemetry Readouts -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="188" height="54" fill="#121518" stroke="#262C32" stroke-width="1"/>
      <text x="14" y="19" fill="#8C969E" font-size="10.5" class="mono">GOLDEN mAP50 (RT-DETRv2)</text>
      <text x="14" y="43" fill="#FFB21F" font-size="22" font-weight="700" class="mono">91.43%</text>

      <rect x="204" y="0" width="188" height="54" fill="#121518" stroke="#262C32" stroke-width="1"/>
      <text x="218" y="19" fill="#8C969E" font-size="10.5" class="mono">GOLDEN mAP50-95</text>
      <text x="218" y="43" fill="#F2F4F3" font-size="22" font-weight="700" class="mono">85.14%</text>

      <rect x="408" y="0" width="196" height="54" fill="#121518" stroke="#262C32" stroke-width="1"/>
      <text x="422" y="19" fill="#8C969E" font-size="10.5" class="mono">CIEDE2000 COLOUR ACC.</text>
      <text x="422" y="43" fill="#5FD39A" font-size="22" font-weight="700" class="mono">85.71%</text>

      <rect x="620" y="0" width="190" height="54" fill="#121518" stroke="#262C32" stroke-width="1"/>
      <text x="634" y="19" fill="#8C969E" font-size="10.5" class="mono">PERSON COUNT MAE</text>
      <text x="634" y="43" fill="#5FD39A" font-size="22" font-weight="700" class="mono">0.00 (100%)</text>
    </g>
  </g>
</svg>
