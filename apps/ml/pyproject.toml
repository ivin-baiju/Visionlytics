[project]
name = "visionlytics-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "onnxruntime==1.31.1",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "python-multipart==0.0.33",
]

[dependency-groups]
dev = ["pytest", "httpx2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
