[project]
name = "visionlytics"
version = "1.0.0"
description = "Visionlytics - Crowd Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "pillow>=10.0.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
